
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Task Manager</h1>
        <p>Gestionarea simplă a sarcinilor</p>
    </header>

    <nav>
        <a href="#">Acasă</a>
        <a href="#taskSection">Sarcini</a>
        <a href="#about">Despre</a>
    </nav>

    <main id="taskSection">
        <h2>Lista mea de sarcini</h2>

        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Introdu o sarcină">
            <button id="addTask">Adaugă</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Toate</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Finalizate</button>
        </div>

        <p id="taskCounter">Număr de sarcini: 0</p>
        <ul id="taskList"></ul>

        <button id="darkMode">Dark Mode</button>
    </main>

    <footer id="about">
        <p>&copy; 2026 Task Manager. Toate drepturile rezervate.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
