<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Task Manager</h1>
        <p>Gestionarea simplă a sarcinilor</p>
    </header>
    <nav>
    <a href="#">Acasă</a>
    <a href="#">Sarcini</a>
    <a href="#">Despre</a>
    </nav>

    <main>
        <input type="text" id="taskInput" placeholder="Introdu o sarcină">
        <button id="addTask">Adaugă</button>

        <ul id="taskList"></ul>
        <button id="darkMode">Dark Mode</button>
    </main>

    <h2>Lista mea de sarcini</h2>
    <p id="taskCounter">Număr de sarcini: 0</p>

    <script src="script.js"></script>
    <footer>
    <p>&copy; 2026 Task Manager. Toate drepturile rezervate.</p>
</footer>
</body>
</html>
